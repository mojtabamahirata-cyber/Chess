<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#161a20">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>♟️ شطرنج موجون</title>
<style>
:root{
  --bg:#13161c; --panel:#1d222b; --panel2:#262d38; --text:#eef1f5; --muted:#97a3b3;
  --accent:#f2b134; --good:#58c06a; --bad:#e5594f;
  --light:#eeeed2; --dark:#769656;
  --last:rgba(255,214,10,.42); --sel:rgba(40,120,60,.55);
}
body.t-brown{--light:#f0d9b5;--dark:#b58863}
body.t-blue{--light:#dfe6ea;--dark:#7f9bad}
body.t-night{--light:#8e97a6;--dark:#4a5262}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
.app{max-width:560px;margin:0 auto;padding:10px 10px calc(18px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 10px}
header h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.2px}
#status{font-size:13px;color:var(--muted);text-align:left;direction:rtl;min-height:18px}
#status.think::after{content:"";display:inline-block;width:10px;height:10px;margin-inline-start:8px;border-radius:50%;
  border:2px solid var(--accent);border-top-color:transparent;animation:spin .8s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:12px;padding:8px 10px;min-height:52px}
.bar .av{width:34px;height:34px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:18px;flex:none}
.bar .nm{font-size:14px;font-weight:700;line-height:1.2}
.bar .sub{font-size:11px;color:var(--muted);margin-top:2px}
.bar .info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.cap{display:flex;flex-wrap:wrap;align-items:center;gap:0;min-height:18px;direction:ltr;justify-content:flex-start}
.cap svg{width:16px;height:16px;margin-inline-end:-5px}
.cap .adv{font-size:11px;color:var(--muted);margin-inline-start:9px;direction:ltr}
.clock{font-variant-numeric:tabular-nums;font-size:19px;font-weight:800;background:var(--panel2);padding:5px 10px;border-radius:9px;min-width:72px;text-align:center;direction:ltr}
.clock.on{background:#32402f;color:#cfeccf}
.clock.low{background:#4a2423;color:#ffb9b3}
.clock.off{display:none}
.bar.turn{outline:2px solid rgba(242,177,52,.55)}
#boardWrap{position:relative;margin:8px 0;touch-action:none;user-select:none;-webkit-user-select:none}
#board{position:relative;width:100%;aspect-ratio:1;border-radius:8px;overflow:hidden;direction:ltr;
  box-shadow:0 8px 28px rgba(0,0,0,.45)}
#squares{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
.sq{position:relative;background:var(--light)}
.sq.d{background:var(--dark)}
.sq.last::before,.sq.sel::before{content:"";position:absolute;inset:0;background:var(--last)}
.sq.sel::before{background:var(--sel)}
.sq.chk::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,40,30,.95) 0%,rgba(230,40,30,.65) 38%,rgba(230,40,30,0) 72%)}
.sq.hint::before{content:"";position:absolute;inset:0;background:rgba(70,150,255,.5)}
.sq.t::after{content:"";position:absolute;inset:36%;border-radius:50%;background:rgba(0,0,0,.24)}
.sq.t.cap::after{inset:5%;background:none;border:max(4px,.9vmin) solid rgba(0,0,0,.24)}
.sq .co{position:absolute;font-size:clamp(9px,2.6vw,13px);font-weight:700;line-height:1;opacity:.9;pointer-events:none}
.sq .co.r{top:3px;left:4px}.sq .co.f{bottom:3px;right:4px}
.sq.d .co{color:var(--light)}.sq:not(.d) .co{color:var(--dark)}
#pieces{position:absolute;inset:0;pointer-events:none}
.pc{position:absolute;width:12.5%;height:12.5%;will-change:transform}
.pc svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.35))}
.pc.w{--f:#fbf6e9;--s:#2a2623;--d:#2a2623}
.pc.b{--f:#3b3d44;--s:#0e0e10;--d:#d7d9de}
.pc.anim{transition:transform .17s ease-out}
.pc.ghostsrc{opacity:.25}
#ghost{position:fixed;z-index:50;pointer-events:none;display:none;transform:translate(-50%,-62%) scale(1.18)}
#ghost svg{width:100%;height:100%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
#ghost.w{--f:#fbf6e9;--s:#2a2623;--d:#2a2623}#ghost.b{--f:#3b3d44;--s:#0e0e10;--d:#d7d9de}
.p-b{fill:var(--f);stroke:var(--s);stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.p-d{fill:none;stroke:var(--d);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.p-e{fill:var(--s);stroke:none}
#over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,12,16,.62);backdrop-filter:blur(2px);z-index:20}
#over.show{display:flex}
#over .card{background:var(--panel);border-radius:16px;padding:18px 18px 14px;width:min(86%,330px);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#over h2{margin:0 0 4px;font-size:22px}
#over p{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.5}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:0;border:0;border-radius:11px;padding:12px 8px;font:inherit;font-size:14px;font-weight:700;color:var(--text);background:var(--panel2);cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:#1b1405}
.btn:disabled{opacity:.4}
.ctl{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px}
.ctl .btn{padding:11px 2px;font-size:20px;line-height:1}
.ctl .btn small{display:block;font-size:10px;font-weight:600;margin-top:4px;color:var(--muted)}
#moves{margin-top:10px;background:var(--panel);border-radius:12px;padding:8px 10px;min-height:44px;max-height:132px;overflow:auto;font-size:14px;direction:ltr;text-align:left;line-height:1.9}
#moves .n{color:var(--muted);margin:0 3px 0 8px;font-size:12px}
#moves .m{display:inline-block;padding:0 6px;border-radius:6px;cursor:pointer}
#moves .m.cur{background:var(--accent);color:#1b1405;font-weight:700}
#moves .e{color:var(--muted);direction:rtl;display:block;text-align:center;font-size:13px}
.nav{display:flex;gap:6px;margin-top:8px;direction:ltr}
.nav .btn{padding:9px 0;font-size:16px}
.modal{position:fixed;inset:0;background:rgba(5,7,10,.66);display:none;align-items:flex-end;justify-content:center;z-index:60}
.modal.show{display:flex}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 12px;font-size:17px}
.row{margin:0 0 14px}
.row label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:56px;border:2px solid transparent;border-radius:10px;padding:10px 6px;font:inherit;font-size:13px;font-weight:700;background:var(--panel2);color:var(--text);cursor:pointer}
.seg button.on{border-color:var(--accent);background:#3a3220}
.menu .btn{display:block;width:100%;text-align:right;margin-bottom:8px;padding:13px 14px;font-size:15px}
#promo .sheet{max-width:360px;border-radius:18px;margin-bottom:auto;margin-top:auto}
.modal.center{align-items:center}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pgrid button{background:var(--panel2);border:0;border-radius:12px;padding:6px;cursor:pointer;aspect-ratio:1}
.pgrid svg{width:100%;height:100%}
.pgrid .w{--f:#fbf6e9;--s:#2a2623;--d:#2a2623}.pgrid .b{--f:#3b3d44;--s:#0e0e10;--d:#d7d9de}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
textarea.fen{width:100%;background:var(--panel2);color:var(--text);border:0;border-radius:10px;padding:10px;font:13px monospace;direction:ltr;min-height:64px}
</style>
</head>

  <header>
    <h1>♟️ شطرنج موجون</h1>

  <div class="bar" id="barBot">

    <button class="btn" id="bFlip">🔄<small>قلب</small></button>

</div>

  <div class="row" id="rLevel"><label>مستوى الكمبيوتر</label>

</div></div>

<script type="text/plain" id="engine-src">(function (root) {

// ============================================================
// محرك الشطرنج: قواعد كاملة + بحث alpha-beta

// الحركة مشفّرة برقم: من | إلى<<6 | ترقية<<12 | علم<<15
// الأعلام: 1 قفزة جندي، 2 أخذ بالمرور، 3 تبييت قصير، 4 تبييت طويل
// ============================================================
const P = 1, N = 2, B = 3, R = 4, Q = 5, K = 6;
const VAL = [0, 100, 320, 330, 500, 900, 0];

function sqFromPoint(x,y){
  const r=boardEl.getBoundingClientRect();
  const col=Math.floor((x-r.left)/r.width*8), row=Math.floor((y-r.top)/r.height*8);
  if(col<0||col>7||row<0||row>7) return -1;
  return sqAt(col,row);
}
function select(sq){
  const ms=legalFrom(sq);
  ui.sel=sq; ui.targets=[...new Set(ms.map(m=>(m>>6)&63))];
  ui.selEp = ms.find(m=>(m>>15)===2) ? (ms.find(m=>(m>>15)===2)>>6&63) : -1;
  renderBoard();
}
function clearSel(){ ui.sel=-1; ui.targets=[]; ui.selEp=-1; renderBoard(); }
function tryMove(from,to){
  const ms=legalFrom(from).filter(m=>((m>>6)&63)===to);
  if(!ms.length){ clearSel(); return false; }
  if(ms.length>1 && ((ms[0]>>12)&7)){ askPromo(ms); return true; }
  doMove(ms[0]); return true;
}
function askPromo(ms){
  const color = cur().turn>0?'w':'b'; const g=$('#pgrid'); g.innerHTML='';
  for(const t of [5,4,3,2]){
    const m=ms.find(x=>((x>>12)&7)===t);
    const b=document.createElement('button'); b.className=color; b.innerHTML=pieceSVG(t);
    b.onclick=()=>{ $('#promo').classList.remove('show'); doMove(m); };
    g.appendChild(b);
  }
  $('#promo').classList.add('show');
}
$('#promo').addEventListener('click',e=>{ if(e.target.id==='promo'){ $('#promo').classList.remove('show'); clearSel(); } });

const wrap=$('#boardWrap');
wrap.addEventListener('pointerdown',e=>{
  if(e.target.closest('#over')) return;
  if(!isHumanTurn()) return;
  const sq=sqFromPoint(e.clientX,e.clientY); if(sq<0) return;
  const s=cur(); const p=s.b[sq];
  if(ui.sel>=0 && ui.targets.includes(sq)){ const f=ui.sel; tryMove(f,sq); return; }
  if(p && (p>0)===(s.turn>0)){
    select(sq);
    ui.drag={from:sq,id:e.pointerId,x:e.clientX,y:e.clientY,moved:false,p};
  } else { clearSel(); }
});
window.addEventListener('pointermove',e=>{
  const d=ui.drag; if(!d||e.pointerId!==d.id) return;
  if(!d.moved){
    if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<9) return;
    d.moved=true;
    const g=$('#ghost'); const w=boardEl.getBoundingClientRect().width/8;
    g.className=d.p>0?'w':'b'; g.style.width=w+'px'; g.style.height=w+'px'; g.innerHTML=pieceSVG(d.p); g.style.display='block';
    const el=piecesEl.querySelector('[data-sq="'+d.from+'"]'); if(el) el.classList.add('ghostsrc');
  }
  const g=$('#ghost'); g.style.left=e.clientX+'px'; g.style.top=e.clientY+'px';
  e.preventDefault();
},{passive:false});
function endDrag(e,cancel){
  const d=ui.drag; if(!d||(e&&e.pointerId!==d.id)) return;
  ui.drag=null; $('#ghost').style.display='none';
  const el=piecesEl.querySelector('[data-sq="'+d.from+'"]'); if(el) el.classList.remove('ghostsrc');
  if(d.moved && !cancel){
    const to=sqFromPoint(e.clientX,e.clientY);
    if(to>=0 && to!==d.from){ if(ui.targets.includes(to)) tryMove(d.from,to); }
  }
}
window.addEventListener('pointerup',e=>endDrag(e,false));
window.addEventListener('pointercancel',e=>endDrag(e,true));

// ---------- الأزرار ----------
function undo(){
  const g=game; if(!g.moves.length || g.cfg.mode==='net') return;
  ui.aiId++; ui.thinking=false; ui.hint=[];
  let cut;
  if(g.cfg.mode==='ai'){
    cut=-1; for(let j=g.moves.length-1;j>=0;j--){ if(g.states[j].turn===g.human){ cut=j; break; } }
    if(cut<0) return;
  } else cut=g.moves.length-1;
  g.moves.length=cut; g.states.length=cut+1; g.hashes.length=cut+1;
  g.result=null; ui.vi=null; ui.sel=-1; ui.targets=[];
  if(g.clock) g.clock.last=Date.now();
  render(); persist(); maybeAI();
}
$('#bUndo').onclick=undo;
$('#bFlip').onclick=()=>{ ui.flip=!ui.flip; render(); };
$('#bHint').onclick=()=>{
  if(!isHumanTurn() || game.cfg.mode==='net') return;
  toast('💡 أفكر بأفضل نقلة…');
  const g=game, id=++ui.aiId;
  runEngine(cur(),{depth:6,ms:1200,history:g.hashes.slice(0,-1)}).then(r=>{
    if(game!==g||g.result||!r.move) return;
    ui.hint=[r.move&63,(r.move>>6)&63]; render();
    setTimeout(()=>{ ui.hint=[]; renderBoard(); },3500);
  });
};
function nav(i){
  const n=game.moves.length; i=Math.max(0,Math.min(n,i));
  ui.vi = i===n ? null : i; ui.sel=-1; ui.targets=[]; ui.hint=[]; render();
}
$('#nFirst').onclick=()=>nav(0);
$('#nPrev').onclick=()=>nav((ui.vi==null?game.moves.length:ui.vi)-1);
$('#nNext').onclick=()=>nav((ui.vi==null?game.moves.length:ui.vi)+1);
$('#nLast').onclick=()=>nav(game.moves.length);
$('#moves').addEventListener('click',e=>{ const m=e.target.closest('.m'); if(m) nav(+m.dataset.i); });
$('#ovRev').onclick=()=>{ $('#over').classList.remove('show'); nav(game.moves.length-1); };
$('#ovNew').onclick=()=>openNew();
$('#ovShare').onclick=shareResult;

function seg(id,key,cb){
  const el=$(id);
  el.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; cfg[key]=isNaN(+b.dataset.v)?b.dataset.v:+b.dataset.v; syncSeg(); if(cb) cb(); };
}
function syncSeg(){
  const map={'#sMode':'mode','#sLevel':'level','#sColor':'color','#sTime':'time','#sTheme':'theme'};
  for(const id in map){ [...$(id).children].forEach(b=>b.classList.toggle('on', String(cfg[map[id]])===b.dataset.v)); }
  $('#rLevel').style.display = cfg.mode==='ai'?'':'none';
  $('#rColor').style.display = (cfg.mode==='ai'||cfg.mode==='net')?'':'none';
  $('#rNet').style.display = cfg.mode==='net'?'':'none';
  $('#goNew').textContent = cfg.mode==='net' ? '🌐 إنشاء غرفة' : 'ابدأ اللعب';
  $('#oSound').classList.toggle('on',cfg.sound); $('#oLegal').classList.toggle('on',cfg.legal);
  document.body.className='t-'+cfg.theme;
}
seg('#sMode','mode'); seg('#sLevel','level'); seg('#sColor','color'); seg('#sTime','time'); seg('#sTheme','theme');
$('#oSound').onclick=()=>{ cfg.sound=!cfg.sound; syncSeg(); };
$('#oLegal').onclick=()=>{ cfg.legal=!cfg.legal; syncSeg(); };
function openNew(){ syncSeg(); $('#mMenu').classList.remove('show'); $('#mNew').classList.add('show'); }
$('#bNew').onclick=()=>{
  if(game && !game.result && game.moves.length>2 && !confirm('تبدأ لعبة جديدة؟ المباراة الحالية تنحذف.')) return;
  openNew();
};
$('#cancelNew').onclick=()=>$('#mNew').classList.remove('show');
$('#goNew').onclick=()=>{ if(cfg.mode==='net'){ hostRoom(); return; } $('#mNew').classList.remove('show'); newGame(); };
$('#bMenu').onclick=()=>$('#mMenu').classList.add('show');
$('#mClose').onclick=()=>$('#mMenu').classList.remove('show');
for(const id of ['mNew','mMenu','mFenBox']) $('#'+id).addEventListener('click',e=>{ if(e.target.id===id) e.target.classList.remove('show'); });

$('#mResign').onclick=()=>{
  $('#mMenu').classList.remove('show');
  if(game.result||!game.moves.length){ toast('ما في مباراة جارية'); return; }
  const who = (game.cfg.mode==='ai'||game.cfg.mode==='net') ? game.human : cur().turn;
  if(confirm('تستسلم؟')){ if(game.cfg.mode==='net') netSend({t:'resign'}); endGame({type:'resign', winner:-who}); }
};
$('#mDraw').onclick=()=>{
  $('#mMenu').classList.remove('show');
  if(game.result||!game.moves.length) return;
  if(game.cfg.mode==='net'){ netSend({t:'draw'}); toast('تم إرسال عرض التعادل للخصم'); return; }
  if(game.cfg.mode==='ai'){ toast('عرض التعادل للاعبين اثنين فقط'); return; }
  if(confirm('الخصم يقبل التعادل؟')) endGame({type:'agreed'});
};
function pgn(){
  const g=game; const r=g.result;
  let res='*';
  if(r){ res = r.winner===1?'1-0':(r.winner===-1?'0-1':'1/2-1/2'); }
  const d=new Date(); const pad=n=>(n<10?'0':'')+n;
  let h='[Event "Mojon Chess"]\n[Date "'+d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+'"]\n';
  if(g.start!==E.START) h+='[FEN "'+g.start+'"]\n[SetUp "1"]\n';
  h+='[Result "'+res+'"]\n\n';
  let body='';
  g.moves.forEach((m,i)=>{ if(g.states[i].turn>0) body+=g.states[i].full+'. '; else if(i===0) body+=g.states[0].full+'... '; body+=m.san+' '; });
  return h+body+res;
}
function shareResult(){
  const g=game; const r=g.result;
  const head = r ? resultText(r).short : 'المباراة جارية';
  const mode = g.cfg.mode==='ai' ? 'ضد الكمبيوتر ('+LEVELS[g.cfg.level].name+')' : 'لاعبين';
  const txt='♟️ شطرنج موجون\n'+head+'\n'+mode+' · '+Math.ceil(g.moves.length/2)+' نقلة\n\n'+pgn().split('\n\n')[1];
  copy(txt,'تم نسخ النتيجة، الصقها بالكروب');
}
$('#mShare').onclick=()=>{ $('#mMenu').classList.remove('show'); shareResult(); };
$('#mPgn').onclick=()=>{ $('#mMenu').classList.remove('show'); copy(pgn(),'تم نسخ PGN'); };
$('#mFen').onclick=()=>{ $('#mMenu').classList.remove('show'); $('#fenTxt').value=E.toFEN(shown()); $('#mFenBox').classList.add('show'); };
$('#fenCopy').onclick=()=>copy($('#fenTxt').value,'تم النسخ');
$('#fenClose').onclick=()=>$('#mFenBox').classList.remove('show');
$('#fenLoad').onclick=()=>{
  const f=$('#fenTxt').value.trim();
  try{
    const s=E.fromFEN(f);
    if(s.kw<0||s.kb<0) throw 0;
    if(E.attacked(s.b, s.turn>0?s.kb:s.kw, s.turn)) throw 0;   // الملك المقابل ما يكون تحت الهجوم
    $('#mFenBox').classList.remove('show'); newGame({fen:f});
  }catch(e){ toast('وضع FEN غير صحيح'); }
};
function copy(t,msg){
  const done=()=>toast(msg||'تم النسخ');
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done,()=>fallback()); } else fallback();
  function fallback(){ const a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); try{document.execCommand('copy');}catch(e){} a.remove(); done(); }
}
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2200); }

// ---------- صوت ----------
let ac=null;
function sound(kind){
  if(!cfg.sound) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const now=ac.currentTime;
    const tone=(f,t0,dur,type,vol)=>{ const o=ac.createOscillator(), g=ac.createGain(); o.type=type||'sine'; o.frequency.value=f;
      g.gain.setValueAtTime(vol||.12,now+t0); g.gain.exponentialRampToValueAtTime(.0008,now+t0+dur); o.connect(g); g.connect(ac.destination); o.start(now+t0); o.stop(now+t0+dur+.02); };
    if(kind==='move') tone(300,0,.07,'triangle',.16);
    else if(kind==='cap'){ tone(200,0,.09,'square',.1); tone(140,.04,.1,'triangle',.14); }
    else if(kind==='check'){ tone(520,0,.1,'square',.08); tone(720,.09,.14,'square',.08); }
    else if(kind==='end'){ tone(440,0,.18,'triangle',.14); tone(554,.16,.18,'triangle',.14); tone(659,.32,.3,'triangle',.14); }
    else if(kind==='draw'){ tone(400,0,.2,'triangle',.12); tone(330,.18,.3,'triangle',.12); }
  }catch(e){}
}

// ---------- أونلاين (غرف عبر ntfy.sh) ----------
const NET_BASE='https://ntfy.sh/';
let nid; try{ nid=sessionStorage.getItem('mojon_nid'); if(!nid){ nid=Math.random().toString(36).slice(2,10); sessionStorage.setItem('mojon_nid',nid); } }catch(e){ nid=Math.random().toString(36).slice(2,10); }
const net={id:nid, code:null, role:null, es:null, ready:false, peer:null, hostColor:1, time:0, joinTimer:0, joinRetry:0};
function newCode(){ const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let c=''; for(let i=0;i<6;i++) c+=a[Math.floor(Math.random()*a.length)]; return c; }
function netSend(o,tries){
  if(!net.code) return;
  o.c=net.id; tries=tries||0;
  const url=NET_BASE+'mojonchess-'+net.code;
  fetch(url,{method:'POST',body:JSON.stringify(o)}).then(r=>{ if(!r.ok) throw 0; }).catch(()=>{
    if(tries<3 && net.code) setTimeout(()=>netSend(o,tries+1),1200*(tries+1));
    else if(net.code) toast('⚠️ مشكلة بالاتصال بالإنترنت');
  });
}
function netOpen(code,role){
  netClose(true);
  net.code=code; net.role=role; net.ready=false; net.peer=null;
  const es=new EventSource(NET_BASE+'mojonchess-'+code+'/sse'); net.es=es;
  es.onmessage=ev=>{
    let d,m; try{ d=JSON.parse(ev.data); }catch(e){ return; }
    if(!d || d.event!=='message') return;
    try{ m=JSON.parse(d.message); }catch(e){ return; }
    if(!m || m.c===net.id) return;
    netRecv(m);
  };
  es.onopen=()=>{ if(net.ready) netSend({t:'sync'}); else if(net.role==='guest') netSend({t:'join'}); };
}
function netClose(quiet){
  clearTimeout(net.joinTimer); clearInterval(net.joinRetry);
  if(net.es){ if(net.ready && !quiet) netSend({t:'leave'}); net.es.close(); net.es=null; }
  net.code=null; net.ready=false; net.peer=null;
}
function startNet(myColor,time,mv){
  $('#mNew').classList.remove('show'); $('#mRoom').classList.remove('show');
  newGame({net:true, human:myColor, cfg:{mode:'net', time:time||0}});
  if(mv && mv.length) applyRemote(mv);
}
function applyRemote(mv){
  const g=game; if(!g || g.cfg.mode!=='net' || !Array.isArray(mv)) return;
  const have=g.moves.length;
  for(let i=0;i<Math.min(have,mv.length);i++) if(g.moves[i].m!==mv[i]) return;
  for(let i=have;i<mv.length;i++){
    if(game!==g || g.result) break;
    doMove(mv[i]);
    if(g.moves.length!==i+1) break;
  }
}
function netRecv(m){
  if(m.to && m.to!==net.id) return;
  if(net.peer && m.c!==net.peer && m.t!=='join' && m.t!=='start' && m.t!=='full') return;
  const g=game;
  switch(m.t){
    case 'join':
      if(net.role!=='host') break;
      if(net.peer && net.peer!==m.c){ netSend({t:'full', to:m.c}); break; }
      net.peer=m.c;
      if(!net.ready){ net.ready=true; startNet(net.hostColor, net.time); }
      netSend({t:'start', to:m.c, hc:net.hostColor, time:net.time, mv:game.moves.map(x=>x.m)});
      break;
    case 'start':
      if(net.role!=='guest') break;
      if(!net.ready){ clearTimeout(net.joinTimer); clearInterval(net.joinRetry); net.ready=true; net.peer=m.c; startNet(-m.hc, m.time, m.mv); toast('🌐 دخلت الغرفة — لعبة موفقة!'); }
      else applyRemote(m.mv);
      break;
    case 'full':
      if(!net.ready){ netClose(true); toast('الغرفة ممتلئة'); openNew(); }
      break;
    case 'move': applyRemote(m.mv); break;
    case 'sync': if(net.ready && g && g.cfg.mode==='net') netSend({t:'move', mv:g.moves.map(x=>x.m)}); break;
    case 'resign': if(g && g.cfg.mode==='net' && !g.result) endGame({type:'resign', winner:g.human}); break;
    case 'draw':
      if(g && g.cfg.mode==='net' && !g.result){
        if(confirm('خصمك يعرض التعادل، تقبل؟')){ netSend({t:'drawok'}); endGame({type:'agreed'}); }
        else netSend({t:'drawno'});
      }
      break;
    case 'drawok': if(g && g.cfg.mode==='net' && !g.result) endGame({type:'agreed'}); break;
    case 'drawno': toast('الخصم رفض التعادل'); break;
    case 'leave': toast('الخصم غادر الغرفة'); break;
  }
}
function hostRoom(code,color,time){
  const col = color || cfg.color;
  const hc = col==='r' ? (Math.random()<.5?1:-1) : (col==='w'?1:-1);
  code = code || newCode(); netOpen(code,'host');
  net.hostColor=hc; net.time = (time===undefined ? cfg.time : time);
  $('#mNew').classList.remove('show');
  $('#roomCode').textContent=code; $('#mRoom').classList.add('show');
}
function joinRoom(code){
  code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length<4){ toast('اكتب كود الغرفة'); return; }
  $('#mNew').classList.remove('show');
  netOpen(code,'guest'); toast('جاري الدخول للغرفة…');
  net.joinRetry=setInterval(()=>{ if(net.ready) clearInterval(net.joinRetry); else netSend({t:'join'}); },3000);
  net.joinTimer=setTimeout(()=>{ if(!net.ready){ netClose(true); toast('ما لقيت الغرفة، تأكد من الكود'); openNew(); } },90000);
}
const roomLink=()=>location.origin+location.pathname+'?room='+net.code;
$('#roomCopyLink').onclick=()=>copy(roomLink(),'تم نسخ الرابط، أرسله لصديقك');
$('#roomCopyCode').onclick=()=>copy(net.code||'','تم نسخ الكود');
$('#roomCancel').onclick=()=>{ netClose(true); $('#mRoom').classList.remove('show'); openNew(); };
$('#joinBtn').onclick=()=>joinRoom($('#roomIn').value);
window.addEventListener('pagehide',()=>{ if(net.ready) netSend({t:'leave'}); });

// ---------- بدء ----------
buildSquares();
window.addEventListener('resize',()=>{});
(function init(){
  const q=new URLSearchParams(location.search);
  const sv=loadSave();
  if(sv && sv.cfg) Object.assign(cfg, sv.cfg);
  // روابط مباشرة من البوت: ?mode=2p  ?lvl=1..5  ?color=w|b|r  ?time=3|5|10|15
  let urlOpts=null;
  if(q.has('mode')||q.has('lvl')||q.has('color')||q.has('time')){
    urlOpts={};
    if(q.get('mode')==='2p'||q.get('mode')==='ai') urlOpts.mode=q.get('mode');
    if(+q.get('lvl')>=1 && +q.get('lvl')<=5) urlOpts.level=+q.get('lvl');
    if(['w','b','r'].includes(q.get('color'))) urlOpts.color=q.get('color');
    if([0,3,5,10,15].includes(+q.get('time')) && q.has('time')) urlOpts.time=+q.get('time');
  }
  syncSeg();
  if(q.has('room')){
    game={start:E.START,states:[E.fromFEN(E.START)],moves:[],hashes:[E.hash(E.fromFEN(E.START))],result:null,human:1,cfg:{mode:'ai',level:3,time:0},clock:null};
    render();
    const rc=(q.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(q.get('h')==='1'){
      const col=['w','b','r'].includes(q.get('color'))?q.get('color'):'r';
      const tm=[3,5,10,15].includes(+q.get('time'))?+q.get('time'):0;
      hostRoom(rc||undefined,col,tm);
    } else joinRoom(rc);
    return;
  }
  if(urlOpts){ Object.assign(cfg,urlOpts); newGame(); return; }
  if(sv && sv.g){
    try{ restore(sv); render(); if(!game.result) maybeAI(); return; }catch(e){}
  }
  game={start:E.START,states:[E.fromFEN(E.START)],moves:[],hashes:[E.hash(E.fromFEN(E.START))],result:null,human:1,cfg:{mode:'ai',level:3,time:0},clock:null};
  render(); openNew();
})();
window.__chess = {E, get game(){return game;}, ui, doMove, cfg, newGame, tryMove};
})();
